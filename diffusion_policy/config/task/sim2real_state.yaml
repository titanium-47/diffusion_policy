name: sim2real_image

shape_meta: &shape_meta
  obs:
    end_effector_pose:
      shape: [6] #[9]
      type: low_dim
    arm_joint_pos:
      shape: [6]
      type: low_dim
    last_arm_action:
      shape: [6]
      type: low_dim
    last_gripper_action:
      shape: [1]
      type: low_dim
    insertive_asset_pose:
      shape: [6]
      type: low_dim
    receptive_asset_pose:
      shape: [6]
      type: low_dim
    insertive_asset_in_receptive_asset_frame:
      shape: [6]
      type: low_dim
  action:
    shape: [7]   

obs_dim: 37
action_dim: 7
task_name: &task_name sim2real_image

env_runner:
  _target_: diffusion_policy.env_runner.dummy_runner.DummyRunner

dataset:
  _target_: diffusion_policy.dataset.sim2real_image_dataset.Sim2RealImageMultiDataset
  # Option 1: Single dataset directory (backward compatible)
  dataset_dir: ../datasets_test
  
  # Option 2: Multiple dataset directories with sampling ratios
  # dataset_config:
  #   - dataset_dir: ../datasets/0
  #     sampling_ratio: 0.5
  #   - dataset_dir: ../datasets/1
  #     sampling_ratio: 0.5
  
  use_streaming: false
  samples_per_file_multiplier: 1.0
  shape_meta: *shape_meta
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1+${n_latency_steps}'}
  pad_after: ${eval:'${n_action_steps}-1'}
  n_obs_steps: ${dataset_obs_steps}
  n_latency_steps: ${n_latency_steps}
  seed: 42
  val_ratio: 0.05
  use_cache: false
  use_disk: false
  # action_norm_mode: ${action_norm_mode}